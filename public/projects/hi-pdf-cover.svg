<text x="77" y="390" fill="#5E7188" font-family="Arial,sans-serif" font-size="15">Chuyển đổi, chỉnh sửa, ký số và dịch tài liệu giữ nguyên 100% bố cục</text><text x="77" y="414" fill="#5E7188" font-family="Arial,sans-serif" font-size="15">gốc. Hoàn toàn miễn phí, không chèn watermark và bảo mật dữ liệu</text><text x="77" y="438" fill="#5E7188" font-family="Arial,sans-serif" font-size="15">tuyệt đối.</text>
